<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gửi Video & JSON Lên Telegram</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-blue: #007aff;
            --ios-red: #ff3b30;
            --ios-green: #34c759;
            --ios-gray: #8e8e93;
            --ios-separator: #c6c6c8;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--ios-bg);
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            font-weight: 600;
            font-size: 24px;
            margin-bottom: 25px;
            color: #000;
        }

        /* Card Style */
        .card {
            background: var(--ios-card);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .section-title {
            font-size: 13px;
            text-transform: uppercase;
            color: var(--ios-gray);
            margin-bottom: 10px;
            margin-left: 5px;
            font-weight: 600;
        }

        /* Video Upload Area */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .video-row {
            display: flex;
            align-items: center;
            background: #f9f9f9;
            border: 1px dashed var(--ios-separator);
            border-radius: 10px;
            padding: 10px;
            transition: all 0.2s;
        }
        
        .video-row:hover {
            border-color: var(--ios-blue);
            background: #f0f7ff;
        }

        /* Custom File Input for iOS look */
        input[type="file"] {
            width: 100%;
            font-size: 14px;
            color: var(--ios-gray);
        }
        input[type="file"]::file-selector-button {
            background-color: var(--ios-blue);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 10px;
            transition: opacity 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            opacity: 0.8;
        }

        .btn-remove {
            background: transparent;
            color: var(--ios-red);
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            line-height: 1;
            margin-left: auto;
        }

        /* Form Inputs */
        .form-group {
            position: relative;
            border-bottom: 0.5px solid var(--ios-separator);
            padding: 10px 0;
        }
        .form-group:last-child {
            border-bottom: none;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        label {
            font-size: 15px;
            font-weight: 500;
        }

       textarea {
    width: 100%;
    border: none;
    background: #f1f1f178;
    font-size: 16px;
    font-family: inherit;
    resize: none;
    min-height: 60px;
    outline: none;
    color: #333;
    box-sizing: border-box;
    BORDER: 1PX SOLID #e8e0e0;
    BORDER-RADIUS: 6PX;
    PADDING: 10PX;
}
        
        textarea::placeholder {
            color: #c7c7cc;
        }

        .btn-clear {
            background: #e5e5ea;
            color: #8e8e93;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: -30px;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--ios-blue);
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn-submit:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
        .btn-submit:disabled {
            background-color: #b0c4de;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 15px;
            min-height: 20px;
        }
        .success { color: var(--ios-green); font-weight: 600; }
        .error { color: var(--ios-red); font-weight: 600; }
        .processing { color: var(--ios-blue); }

    </style>
</head>
<body>

<div class="container">
    <h2>Làm video cân</h2>
    
    <!-- PHẦN 1: UPLOAD VIDEO -->
    <div class="section-title">Tệp Video Đính Kèm</div>
    <div class="card">
        <div id="video-container" class="video-list">
            <!-- Dòng mặc định -->
            <div class="video-row">
                <input type="file" accept="video/mp4" class="video-file" onchange="handleFileSelect(this)">
                <button class="btn-remove" onclick="removeRow(this)">×</button>
            </div>
        </div>
    </div>

    <!-- PHẦN 2: NHẬP THÔNG TIN JSON -->
    <div class="section-title">Thông Tin Mô Tả</div>
    <div class="card">
        <div class="form-group">
            <div class="label-row">
                <label for="chuDe">Chủ đề video</label>
                <button class="btn-clear" onclick="clearField('chuDe')">×</button>
            </div>
            <textarea id="chuDe" placeholder="Nhập chủ đề...">Video giới thiệu Cân điện tử xxx</textarea>
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="mucTieu">Mục tiêu</label>
                <button class="btn-clear" onclick="clearField('mucTieu')">×</button>
            </div>
            <textarea id="mucTieu" placeholder="Nhập mục tiêu...">Cho khách hàng biết cân này có phù hợp với nhu cầu của họ không</textarea>
        </div>

        <div class="form-group">
            <div class="label-row">
                <label for="khachHang">Khách hàng mục tiêu</label>
                <button class="btn-clear" onclick="clearField('khachHang')">×</button>
            </div>
            <textarea id="khachHang" placeholder="Nhập đối tượng khách hàng...">Cân WHB 28 này độ chính xác đến 0,1 gram dùng cho:Pha chế, nấu ăn tại nhà hoặc cửa hàng: giúp cân nguyên liệu quán cafe, mẻ bánh một lần cực tiện.Cân đồ khô, yến sào rõ ràng: Tránh thất thoát, kiểm tra trọng lượng minh bạch, tạo uy tín với khách.Định lượng thực phẩm ăn chế độ nhanh gọn: Chia khẩu phần ăn theo tuần cho gia đình hoặc khách đặt hàng.Cân gia vị, thuốc bắc chính xác: Đong đếm nhanh các mẻ thảo dược lớn, tiết kiệm thời gian chia lẻ. Pin sạc, chống nước, độ chính xác cao</textarea>
        </div>
    </div>

    <button id="btn-submit" class="btn-submit" onclick="processAndSend()">LÀM VIDEO</button>
    <div id="status"></div>
</div>

<script>
    // ⚠️ CẤU HÌNH TELEGRAM
    const BOT_TOKEN = '5420705842:AAFI_x963vfDFdimnGWyMrg8Ys-_LAkstw0';
    const CHAT_ID = '-5534880712';
    const TMPFILES_API = 'https://tmpfiles.org/api/v1/upload';

    // --- HÀM XÓA NỘI DUNG INPUT ---
    function clearField(id) {
        document.getElementById(id).value = '';
        document.getElementById(id).focus();
    }

    // --- XỬ LÝ GIAO DIỆN VIDEO (LOGIC MỚI) ---
    
    // Hàm xử lý khi chọn file: Tự động thêm dòng mới nếu dòng hiện tại có file
    function handleFileSelect(input) {
        if (input.files && input.files.length > 0) {
            addVideoRow();
        }
    }

    function addVideoRow() {
        const container = document.getElementById('video-container');
        // Giới hạn tối đa 10 file để tránh lỗi
        if (container.children.length >= 10) return;

        const row = document.createElement('div');
        row.className = 'video-row';
        // Gán sự kiện onchange vào input mới tạo
        row.innerHTML = `
            <input type="file" accept="video/mp4" class="video-file" onchange="handleFileSelect(this)">
            <button class="btn-remove" onclick="removeRow(this)">×</button>
        `;
        container.appendChild(row);
    }

    function removeRow(btn) {
        const container = document.getElementById('video-container');
        // Luôn giữ ít nhất 1 dòng (dù trống)
        if (container.children.length > 1) {
            btn.parentElement.remove();
        } else {
            // Nếu là dòng duy nhất, chỉ xóa file đã chọn (reset input)
            const input = container.querySelector('input[type="file"]');
            if(input) input.value = '';
        }
    }

    // --- XỬ LÝ LOGIC CHÍNH (GIỮ NGUYÊN) ---
    async function processAndSend() {
        const submitBtn = document.getElementById('btn-submit');
        const statusDiv = document.getElementById('status');
        
        // 1. Lấy dữ liệu từ các ô nhập liệu
        const chuDe = document.getElementById('chuDe').value.trim();
        const mucTieu = document.getElementById('mucTieu').value.trim();
        const khachHang = document.getElementById('khachHang').value.trim();
        
        const fileInputs = document.querySelectorAll('.video-file');
        const validFiles = [];
        fileInputs.forEach(input => {
            if (input.files.length > 0) validFiles.push(input.files[0]);
        });

        if (validFiles.length === 0) {
            statusDiv.innerHTML = '<span class="error">❌ Vui lòng chọn ít nhất 1 video!</span>';
            return;
        }
        if (!chuDe && !mucTieu && !khachHang) {
            statusDiv.innerHTML = '<span class="error">❌ Vui lòng nhập ít nhất 1 trường thông tin mô tả!</span>';
            return;
        }

        submitBtn.disabled = true;
        statusDiv.className = 'processing';

        try {
            // 2. Upload từng video lên tmpfiles.org
            const videoUrls = [];
            for (let i = 0; i < validFiles.length; i++) {
                statusDiv.innerText = `⏳ Đang upload video ${i + 1}/${validFiles.length}...`;
                
                const formData = new FormData();
                formData.append('file', validFiles[i]);

                const response = await fetch(TMPFILES_API, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.status !== 'success' || !result.data?.url) {
                    throw new Error(`Upload thất bại ở video ${i + 1}`);
                }

                const rawUrl = result.data.url;
                const directUrl = rawUrl.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                videoUrls.push(directUrl);
            }

            // 3. Tạo object JSON tổng hợp
            const jsonData = {
                chu_de_video: chuDe,
                muc_tieu: mucTieu,
                khach_hang_muc_tieu: khachHang,
                video_urls: videoUrls
            };

            // 4. Gửi file mo_ta.json lên Telegram
            statusDiv.innerText = '📤 Đang gửi dữ liệu lên Telegram...';
            
            const jsonString = JSON.stringify(jsonData, null, 4);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const FILE_NAME = 'mo_ta.json';

            const tgFormData = new FormData();
            tgFormData.append('chat_id', CHAT_ID);
            tgFormData.append('document', blob, FILE_NAME);
            tgFormData.append('caption', `📦 File mô tả sản xuất\n🎬 Số video: ${videoUrls.length}\n📝 Chủ đề: ${chuDe || '(trống)'}`);

            const tgResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: tgFormData
            });
            const tgResult = await tgResponse.json();

            if (!tgResult.ok) {
                throw new Error(`Telegram lỗi: ${tgResult.description}`);
            }

            statusDiv.innerHTML = `<span class="success">✅ Đã gửi thành công!</span>`;

        } catch (error) {
            statusDiv.innerHTML = `<span class="error">❌ Lỗi: ${error.message}</span>`;
        } finally {
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
