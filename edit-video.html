<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi Video & JSON Lên Telegram</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 10px;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 25px; }
        
        /* Style cho phần thêm video */
        .video-section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .video-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .video-row input[type="file"] { flex: 1; font-size: 14px; }
        .btn-remove {
            background: #e74c3c; color: white; border: none;
            padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
        }
        .btn-add-video {
            background: transparent; border: 1px solid #3498db; color: #3498db;
            padding: 10px; width: 100%; border-radius: 6px; cursor: pointer;
            font-weight: bold; margin-top: 5px; transition: all 0.2s;
        }
        .btn-add-video:hover { background: #ebf5fb; }

        /* Style cho form nhập liệu */
        .form-group { margin-bottom: 15px; position: relative; }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .label-row label { margin-bottom: 0; font-weight: bold; color: #555; font-size: 14px; }
        .btn-clear {
            background: #e74c3c; color: white; border: none;
margin-bottom:-50px;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 14px; line-height: 22px; text-align: center;
            cursor: pointer; padding: 0; opacity: 0.7; transition: opacity 0.2s;
        }
        .btn-clear:hover { opacity: 1; }
        textarea {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 5px; resize: vertical; min-height: 70px;
            font-family: inherit; box-sizing: border-box; font-size: 14px;
        }

        /* Nút submit và trạng thái */
        .btn-submit {
            width: 100%; padding: 14px; background-color: #28a745;
            color: white; border: none; border-radius: 5px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 10px; transition: background-color 0.3s;
        }
        .btn-submit:hover { background-color: #218838; }
        .btn-submit:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; min-height: 20px; }
        .success { color: #28a745; }
        .error { color: #e74c3c; }
        .processing { color: #f39c12; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gửi Lệnh Sản Xuất Video</h2>
    
    <!-- PHẦN 1: UPLOAD VIDEO -->
    <div class="video-section">
        <label style="margin-bottom: 10px;">📁 Nhập video</label>
        <div id="video-container">
            <div class="video-row">
                <input type="file" accept="video/mp4" class="video-file">
                <button class="btn-remove" onclick="removeRow(this)">X</button>
            </div>
        </div>
        <button class="btn-add-video" onclick="addVideoRow()">+ Thêm </button>
    </div>

    <!-- PHẦN 2: NHẬP THÔNG TIN JSON -->
    <div class="form-group">
        <div class="label-row">
            <label for="chuDe">Chủ đề video:</label>
            <button class="btn-clear" title="Xóa nội dung" onclick="clearField('chuDe')">×</button>
        </div>
        <textarea id="chuDe">Video giới thiệu Cân điện tử xxx</textarea>
    </div>

    <div class="form-group">
        <div class="label-row">
            <label for="mucTieu">Mục tiêu:</label>
            <button class="btn-clear" title="Xóa nội dung" onclick="clearField('mucTieu')">×</button>
        </div>
        <textarea id="mucTieu">Cho khách hàng biết cân này có phù hợp với nhu cầu của họ không</textarea>
    </div>

    <div class="form-group">
        <div class="label-row">
            <label for="khachHang">Khách hàng mục tiêu:</label>
            <button class="btn-clear" title="Xóa nội dung" onclick="clearField('khachHang')">×</button>
        </div>
        <textarea id="khachHang">Cân này dành cho: Cân pha chế, cân làm bánh, cân ăn kiêng</textarea>
    </div>

    <button id="btn-submit" class="btn-submit" onclick="processAndSend()">GỬI LÊN TELEGRAM</button>
    <div id="status"></div>
</div>

<script>
    // ⚠️ CẤU HÌNH TELEGRAM
    const BOT_TOKEN = '5420705842:AAFI_x963vfDFdimnGWyMrg8Ys-_LAkstw0';
    const CHAT_ID = '-5534880712';
    const TMPFILES_API = 'https://tmpfiles.org/api/v1/upload';

    // --- HÀM XÓA NỘI DUNG INPUT ---
    function clearField(id) {
        document.getElementById(id).value = '';
        document.getElementById(id).focus();
    }

    // --- XỬ LÝ GIAO DIỆN VIDEO ---
    function addVideoRow() {
        const container = document.getElementById('video-container');
        if (container.children.length >= 10) {
            alert("Bạn chỉ nên gửi tối đa 10 file mỗi lần!");
            return;
        }
        const row = document.createElement('div');
        row.className = 'video-row';
        row.innerHTML = `
            <input type="file" accept="video/mp4" class="video-file">
            <button class="btn-remove" onclick="removeRow(this)">Xóa</button>
        `;
        container.appendChild(row);
    }

    function removeRow(btn) {
        const container = document.getElementById('video-container');
        if (container.children.length > 1) {
            btn.parentElement.remove();
        } else {
            alert("Phải giữ lại ít nhất một dòng chọn file!");
        }
    }

    // --- XỬ LÝ LOGIC CHÍNH ---
    async function processAndSend() {
        const submitBtn = document.getElementById('btn-submit');
        const statusDiv = document.getElementById('status');
        
        // 1. Lấy dữ liệu từ các ô nhập liệu
        const chuDe = document.getElementById('chuDe').value.trim();
        const mucTieu = document.getElementById('mucTieu').value.trim();
        const khachHang = document.getElementById('khachHang').value.trim();
        
        const fileInputs = document.querySelectorAll('.video-file');
        const validFiles = [];
        fileInputs.forEach(input => {
            if (input.files.length > 0) validFiles.push(input.files[0]);
        });

        if (validFiles.length === 0) {
            statusDiv.innerHTML = '<span class="error">❌ Vui lòng chọn ít nhất 1 video!</span>';
            return;
        }
        if (!chuDe && !mucTieu && !khachHang) {
            statusDiv.innerHTML = '<span class="error">❌ Vui lòng nhập ít nhất 1 trường thông tin mô tả!</span>';
            return;
        }

        submitBtn.disabled = true;
        statusDiv.className = 'processing';

        try {
            // 2. Upload từng video lên tmpfiles.org
            const videoUrls = [];
            for (let i = 0; i < validFiles.length; i++) {
                statusDiv.innerText = `⏳ Đang upload video ${i + 1}/${validFiles.length} lên máy chủ trung gian...`;
                
                const formData = new FormData();
                formData.append('file', validFiles[i]);

                const response = await fetch(TMPFILES_API, { method: 'POST', body: formData });
                const result = await response.json();

                if (result.status !== 'success' || !result.data?.url) {
                    throw new Error(`Upload thất bại ở video ${i + 1}: ${result.message || 'Lỗi không xác định'}`);
                }

                // Chuyển sang direct link: https://tmpfiles.org/dl/xxxxx/file.mp4
                const rawUrl = result.data.url;
                const directUrl = rawUrl.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
                videoUrls.push(directUrl);
            }

            // 3. Tạo object JSON tổng hợp
            const jsonData = {
                chu_de_video: chuDe,
                muc_tieu: mucTieu,
                khach_hang_muc_tieu: khachHang,
                video_urls: videoUrls
            };

            // 4. Gửi file mo_ta.json lên Telegram
            statusDiv.innerText = '📤 Đang gửi file mo_ta.json lên Telegram...';
            
            const jsonString = JSON.stringify(jsonData, null, 4);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const FILE_NAME = 'mo_ta.json';

            const tgFormData = new FormData();
            tgFormData.append('chat_id', CHAT_ID);
            tgFormData.append('document', blob, FILE_NAME);
            tgFormData.append('caption', `📦 File mô tả sản xuất\n🎬 Số video: ${videoUrls.length}\n📝 Chủ đề: ${chuDe || '(trống)'}`);

            const tgResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                method: 'POST',
                body: tgFormData
            });
            const tgResult = await tgResponse.json();

            if (!tgResult.ok) {
                throw new Error(`Telegram lỗi: ${tgResult.description}`);
            }

            statusDiv.innerHTML = `<span class="success">✅ Đã gửi thành công ${videoUrls.length} video + file mo_ta.json lên Telegram!</span>`;

        } catch (error) {
            statusDiv.innerHTML = `<span class="error">❌ Lỗi: ${error.message}</span>`;
        } finally {
            submitBtn.disabled = false;
        }
    }
</script>

</body>
</html>
